name: Build
on:
  push:
    branches: ["26.2"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && ./gradlew :herobot-mod:build :herobot-mod:shadowJar
      - uses: actions/upload-artifact@v4
        with:
          name: herobot-mod
          path: herobot-mod/build/libs/*.jar
